<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Security Monitoring</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 420px;
            padding: 40px;
            border-radius: 10px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .icon {
            width: 55px;
            height: 55px;

            margin: 0 auto 20px;

            background: #243b53;
            color: white;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;
        }

        h1 {
            color: #1f2933;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .description {
            color: #7b8794;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;

            color: #243447;
            font-size: 14px;
            font-weight: 600;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #d9e2ec;
            border-radius: 6px;

            font-size: 14px;

            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #243b53;
        }

        button {
            width: 100%;

            padding: 12px;

            background: #243b53;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #1d3043;
        }

    </style>

</head>


<body>


    <div class="card">

        <div class="icon">
            🔒
        </div>

        <h1>
            Security Monitoring
        </h1>

        <p class="description">
            Enter the security access password to continue
            to the monitoring dashboard.
        </p>


        <form method="POST" action="/security">

            <label>
                Security Password
            </label>

            <input
                type="password"
                name="security_password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Access Dashboard
            </button>

        </form>

    </div>


</body>

</html>
