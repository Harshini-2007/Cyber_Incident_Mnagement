<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .navbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            color: #111827;
        }

        .logout {
            text-decoration: none;
            color: #374151;
            font-size: 14px;
        }

        .container {
            width: 650px;
            margin: 60px auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #4f46e5;
            font-size: 14px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            margin-bottom: 22px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .username-box {
            background: #f9fafb;
            color: #6b7280;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

    </style>
</head>

<body>

    <div class="navbar">

        <div class="logo">
            Organization Employee Portal
        </div>

        <a href="/logout" class="logout">
            Logout
        </a>

    </div>


    <div class="container">

        <a href="/dashboard" class="back">
            ← Back to Dashboard
        </a>

        <div class="card">

            <h1>My Profile</h1>

            <div class="subtitle">
                View and update your account information.
            </div>

            <form method="POST" action="/profile/update">

                <label>Username</label>

                <input
                    type="text"
                    value="{{ user.username }}"
                    class="username-box"
                    readonly
                >

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    value="{{ user.email }}"
                    required
                >

                <button type="submit">
                    Save Changes
                </button>

            </form>

        </div>

    </div>

</body>
</html>
